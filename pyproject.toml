[project]
name = "pulse"
version = "0.1.0"
description = "Pulse 海外社媒内容 Agent（B2B 工业铸件出海）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# 说明：项目根 = 仓库根，Python 包为 `pulse/`（见 AGENTS.md §6 命名规范）。
# 测试从仓库根运行： python -m pytest
[tool.pytest.ini_options]
testpaths = ["pulse/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
