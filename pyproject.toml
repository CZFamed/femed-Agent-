[project]
name = "pulse"
version = "1.11.0"
description = "Pulse 海外社媒内容 Agent（B2B 工业铸件出海）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    # 视频抽帧：自带静态 ffmpeg 二进制。视觉接口不支持视频输入，
    # 只能先抽成静帧再送模型（见 pulse/services/media/video.py）
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# 说明：项目根 = 仓库根，Python 包为 `pulse/`（见 AGENTS.md §6 命名规范）。
# 测试从仓库根运行： python -m pytest
[tool.pytest.ini_options]
# 注意：不要写成 ["pulse/tests"]。
# 按 AGENTS.md §2.1，各域单测位于 pulse/services/<domain>/tests/，
# 而跨域契约/集成测试位于 pulse/tests/。若只列 pulse/tests，
# 各域单测会被静默排除（pytest 仍显示通过），制造"虚假完成"。
testpaths = ["pulse"]
pythonpath = ["."]
asyncio_mode = "auto"
# --import-mode=importlib：各域的 tests/ 目录不需要 __init__.py，
# 也避免两个域出现同名测试文件（如 test_gateway.py）时互相覆盖导致收集报错。
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
